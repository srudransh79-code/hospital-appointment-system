# H2 embedded database (in-memory). No server to install or start:
# the database lives inside the application process and is created fresh
# on every run from schema.sql + data.sql, so every demo starts from
# the same known state.
spring.datasource.url=jdbc:h2:mem:hospitaldb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Run schema.sql and data.sql at startup.
spring.sql.init.mode=always

# Keep the console output readable: no Spring banner, warnings only.
spring.main.banner-mode=off
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
